[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmacore-tm"
version = "1.0.0"
description = "Stability-aware generative adversarial contrastive learning for molecular graph representation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
    { name = "Mallikharjuna Rao Sakhamuri", email = "mallikharjuna.sakhamuri@research.atu.ie" },
    { name = "Shagufta Henna" },
    { name = "Leo Creedon" },
    { name = "Kevin Meehan" },
]

keywords = [
    "molecular graph representation",
    "contrastive learning",
    "generative adversarial networks",
    "momentum encoder",
    "self-supervised learning",
    "molecular property prediction",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
viz = ["umap-learn>=0.5.4", "matplotlib>=3.7.0", "seaborn>=0.12.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.1.0", "black>=23.7.0"]

[project.urls]
Repository = "https://github.com/MallikharjunaSakhamuri/GMACORETM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# UP006/UP035/UP045 rewrite typing.List and Optional[X] into the PEP 585 and
# PEP 604 forms. The package declares requires-python = ">=3.9", where those
# forms are only valid inside annotations, so the rules are not applied.
# N812 flags the near-universal `torch.nn.functional as F` convention.
ignore = ["UP006", "UP035", "UP045", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
